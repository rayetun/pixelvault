name: Update readme and assets

# Pushes readme.txt and the listing assets (banner, icon, screenshots) to SVN
# without cutting a new release. Useful for fixing typos, updating "Tested up to",
# or swapping banners/screenshots between releases.
on:
  push:
    branches:
      - main
    paths:
      - 'readme.txt'
      - '.wordpress-org/**'
  workflow_dispatch: {}

jobs:
  assets:
    name: Update readme and assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update WordPress.org readme and assets
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: pixelvault
          # Update ONLY readme.txt + listing assets, never plugin code. Without this the
          # action rsyncs the whole repo into trunk and aborts ("Other files have been
          # modified") because main is always ahead of the last released SVN trunk. Code
          # ships via deploy.yml on a published release.
          IGNORE_OTHER_FILES: true
